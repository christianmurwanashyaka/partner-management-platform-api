version: '3.8'

services:
  api:
    build: .
    container_name: partner-management-platform-api
    ports:
      - "7001:7001"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: partner-management-platform-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  postgres_data: