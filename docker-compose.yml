services:
  api:
    image: ghcr.io/hisprwanda/partner-management-platform-api:prod
    container_name: partner-management-platform-api
    ports:
      - "7001:7001"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
      - action_plans:/app/action_plans
      - implementation_plans:/app/implementation_plans
      - generated_mou_docs_docx:/app/generated_mou_docs_docx
      - generated_mou_docs_pdf:/app/generated_mou_docs_pdf

  db:
    image: postgres:15-alpine
    container_name: partner-management-platform-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5432:5432"

volumes:
  postgres_data:
  uploads:
  action_plans:
  implementation_plans:
  generated_mou_docs_docx:
  generated_mou_docs_pdf:
